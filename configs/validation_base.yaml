# Base case for the validation suite. Every parameter the validation relies on is set here
# explicitly, so changes to pillarfea/defaults.yaml do not alter the validation.
geometry:
  D_top: 1.0
  h_over_D: 2.0
  taper_deg: 0.0
  fillet_radius: 0.0      # sharp foot for the validation base (fillet validated separately)
material:
  E: 100000.0
  nu: 0.3
  sigma_y_over_E: 0.02
  hardening: {type: linear, Et_over_E: 0.05}
substrate:
  type: elastic
  E: null
  nu: null
  radius_over_D: 40.0
contact:
  top: frictionless
  mu: 0.0
  penalty_factor: 100.0
  stick_ratio: 0.1
  punch_E_factor: 1000.0
loading:
  max_strain: auto
  n_increments: 200
  n_field_frames: 25
mesh:
  n_radial: 16
  radial_bias: 1.2
  n_axial: auto
  axial_bias: 1.5
  n_sub_inner: auto
  sub_inner_depth: 1.0
  n_ring: 24
analysis:
  method: offset
  offset_strain: 0.002
  slope: fit
  slope_window: [0.1, 0.5]
